    <!--========= Navigation start-->
    <div class="container-fluid nav-holder mt-4 p-0"></div>

    <main class="main">
      <div
        id="carouselExampleControls"
        class="carousel slide carousel-fade"
        data-interval="false"
      >
        <div class="carousel-inner">
          <div class="carousel-item" id="div1"></div>
          <div class="carousel-item carousel-item-two" id="div2"></div>
          <div class="carousel-item carousel-item-three" id="div3"></div>
          <div class="carousel-item carousel-item-four" id="div4"></div>

          <button
            class="btn-slider-prev"
            type="button"
            data-bs-target="#carouselExampleControls"
            data-bs-slide="prev"
          >
            <i class="bi bi-arrow-left-circle-fill slider-icon"></i>
          </button>
          <button
            class="btn-slider-next"
            type="button"
            data-bs-target="#carouselExampleControls"
            data-bs-slide="next"
          >
            <i class="bi bi-arrow-right-circle-fill slider-icon"></i>
          </button>
        </div>
      </div>
